x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE}
  security_opt: ["no-new-privileges:true"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASS}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    SILO_APP_ACCESS_KEY: ${SILO_APP_ACCESS_KEY}
    SILO_APP_SECRET_KEY: ${SILO_APP_SECRET_KEY}
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
    WAREHOUSE_DB_PASS: ${WAREHOUSE_DB_PASS}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    S3_ACCESS_KEY: ${SILO_APP_ACCESS_KEY}
    S3_SECRET_KEY: ${SILO_APP_SECRET_KEY}
    WAREHOUSE_DSN: ${WAREHOUSE_DSN}
  volumes:
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS}
      PGDATA: /var/lib/postgresql/data/pgdata
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASS: ${AIRFLOW_DB_PASS}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_DB_PASS: ${WAREHOUSE_DB_PASS}
    ports:
      - "127.0.0.1:${PORT_POSTGRES}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  silo:
    image: ${SILO_IMAGE}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${PORT_SILO_API}:9000"
      - "127.0.0.1:${PORT_SILO_CONSOLE}:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  silo-init:
    image: ${MC_IMAGE}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["bash", "/init.sh"]
    environment:
      SILO_ROOT_USER: ${SILO_ROOT_USER}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      SILO_APP_ACCESS_KEY: ${SILO_APP_ACCESS_KEY}
      SILO_APP_SECRET_KEY: ${SILO_APP_SECRET_KEY}
    volumes:
      - ./docker/silo/init.sh:/init.sh:ro
      - ./data:/seed:ro
    depends_on:
      silo:
        condition: service_healthy

  mc-client:
    image: ${MC_IMAGE}
    profiles: ["tools"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["mc"]
    environment:
      MC_HOST_local: http://${SILO_APP_ACCESS_KEY}:${SILO_APP_SECRET_KEY}@silo:9000
    volumes:
      - ./data:/seed:ro

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["bash", "/opt/airflow/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    restart: unless-stopped
    command: ["api-server"]
    ports:
      - "127.0.0.1:${PORT_AIRFLOW}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      silo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  silo-data:
  airflow-logs:
