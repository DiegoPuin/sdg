name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --env-file env/versions.env --env-file env/.env.dev.example config -q
      - run: docker compose --env-file env/versions.env --env-file env/.env.prod.example config -q

  iac-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install checkov cfn-lint
      - run: checkov -d . --framework dockerfile,cloudformation,github_actions --quiet --compact
      - run: cfn-lint cloudformation/*.yaml

  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit --progress-spinner off .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - run: pytest --cov=src/mdf --cov=checks --cov-fail-under=80

  build:
    needs: [lint, compose-validate, iac-security, deps-audit, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: grep '^AIRFLOW_VERSION=' env/versions.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/airflow/Dockerfile
          build-args: AIRFLOW_VERSION=${{ steps.versions.outputs.AIRFLOW_VERSION }}
          load: true
          push: false
          tags: sdg-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sdg-airflow:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dag-validate:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: grep '^AIRFLOW_VERSION=' env/versions.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reutiliza la caché del job build: la imagen es la misma, sin reconstruir capas.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/airflow/Dockerfile
          build-args: AIRFLOW_VERSION=${{ steps.versions.outputs.AIRFLOW_VERSION }}
          load: true
          push: false
          tags: sdg-airflow:ci
          cache-from: type=gha
      - name: Importar DAGs
        run: |
          out="$(docker run --rm sdg-airflow:ci airflow dags list-import-errors)"
          echo "${out}"
          echo "${out}" | grep -q "No data found"
